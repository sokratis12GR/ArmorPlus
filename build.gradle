plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'net.darkhax.curseforgegradle' version '1.3.33'
    id 'com.modrinth.minotaur' version '2.10.0'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_name
}

tasks.named('jar', Jar).configure {
    archiveFileName = "${mod_id}-${minecraft_version}-${mod_version}-neo.jar"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources {
    srcDir 'src/generated/client'
    srcDir 'src/generated/server'
}

neoForge {
    version = neoforge_version
    validateAccessTransformers = true

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        gameTestServer {
            type = "gameTestServer"
        }

        clientData {
            clientData()
            programArguments.addAll '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/client').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }

        serverData {
            serverData()
            programArguments.addAll '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/server').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }
    }

    mods {
        armorplus {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        enable()
        testedMod = mods.armorplus
    }
}

repositories {
    mavenCentral()
    maven { url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/" }
    maven { url = 'https://cursemaven.com'; content { includeGroup 'curse.maven' } }
}

// Dependencies that are only present in the dev runs, not required by (or published with) the mod
configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {

//    implementation files("../TheDragonLib/build/libs/thedragonlib-26.1.2-1.4.0-neo.jar")
     implementation "curse.maven:thedragonlib-248055:9455147"

    compileOnly "curse.maven:jei-238222:9384706"
    localRuntime "curse.maven:jei-238222:9384706"

    implementation "com.geckolib:geckolib-neoforge-26.1.2:5.5.2"

    testImplementation "org.junit.jupiter:junit-jupiter:5.13.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.named('test', Test).configure { useJUnitPlatform() }

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neoforge_version: neoforge_version,
        neoforge_version_range: neoforge_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
        mod_version: mod_version, mod_authors: mod_authors, mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) { expand replaceProperties }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

publishing {
    publications { mavenJava(MavenPublication) { artifact jar } }
    repositories { maven { url = layout.buildDirectory.dir('repo') } }
}


tasks.named('javadoc', Javadoc) {
    options.encoding = 'UTF-8'
    // keeps broken references and bad syntax visible, most of the code doesn't document every parameter
    options.addBooleanOption('Xdoclint:all,-missing', true)
    options.addStringOption('Xmaxwarns', '10000')
    options.addStringOption('Xmaxerrs', '10000')
    options.links('https://docs.oracle.com/en/java/javase/25/docs/api/')
}


def releaseName = "${mod_name} ${mod_version} for NeoForge ${minecraft_version}"

def changelogFile = file('src/main/resources/changelog.md')
def changelogText = changelogFile.exists()
        ? changelogFile.getText('UTF-8')
        : "${mod_name} ${mod_version} for Minecraft ${minecraft_version}"


modrinth {
    token = providers.gradleProperty('modrinth_api_token')
            .orElse(providers.environmentVariable('MODRINTH_TOKEN')).orNull

    projectId = providers.gradleProperty('modrinth_project_id').orNull

    versionNumber = mod_version.toString()
    versionName = releaseName
    versionType = 'release'

    uploadFile = tasks.named('jar').get()

    gameVersions = [minecraft_version.toString()]
    loaders = ['neoforge']

    changelog = changelogText
}

tasks.register('publishModrinth') {
    group = 'publishing'
    description = "Publishes ${mod_name} to Modrinth"

    dependsOn tasks.named('modrinth')
}

tasks.register('publishCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    group = 'publishing'
    description = "Publishes ${mod_name} to CurseForge"

    apiToken = providers.gradleProperty('curseforge_api_token').orNull

    def projectId = providers.gradleProperty('curseforge_project_id').orNull

    if (projectId) {
        def mainFile = upload(projectId, tasks.named('jar').get())

        mainFile.displayName = releaseName
        mainFile.releaseType = 'release'

        mainFile.changelogType = 'markdown'
        mainFile.changelog = changelogText

        mainFile.addGameVersion(minecraft_version.toString())
        mainFile.addEnvironment('Client', 'Server')
    }
}

tasks.register('publishAll') {
    group = 'publishing'
    description = "Publishes ${mod_name} to CurseForge and Modrinth"

    dependsOn 'publishCurseForge', 'publishModrinth'
}
