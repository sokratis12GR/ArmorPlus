
plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'maven-publish'

    id 'net.minecraftforge.accesstransformers' version '2.0.0'
    id 'net.minecraftforge.gradle' version '7.0.40'
    id 'net.darkhax.curseforgegradle' version '1.3.33'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_name
}

tasks.named('jar', Jar).configure {
    archiveFileName = "${mod_id}-${minecraft_version}-${mod_version}-forge.jar"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    minecraft.mavenizer(it)

    maven fg.forgeMaven
    maven fg.minecraftLibsMaven

    mavenCentral()

    maven {
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
    }

    maven {
        url = 'https://maven.minecraftforge.net/'
    }

    maven {
        url = 'https://cursemaven.com/'

        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    implementation minecraft.dependency(
            "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    )

    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.5'

    implementation "curse.maven:thedragonlib-248055:9012319"
    implementation "com.geckolib:geckolib-forge-26.1.2:5.5.2"
}

sourceSets.main.resources {
    srcDir 'src/generated/client'
    srcDir 'src/generated/server'
}

minecraft {
    accessTransformers.from file(
            'src/main/resources/META-INF/accesstransformer.cfg'
    )

    runs {
        configureEach {
            workingDir = project.file("run-${name}")

            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }

        client {
            workingDir = project.file('run')
        }

        server {
            workingDir = project.file('run')
            args '--nogui'
        }

        gameTestServer {
            workingDir = project.file('run-gameTestServer')
        }

        data {
            workingDir = project.file('run-data')

            args '--mod', mod_id,
                    '--all',
                    '--output', file('build/generated-datagen').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }
    }
}

def datagenOutput = layout.buildDirectory.dir('generated-datagen')
def generatedClient = layout.projectDirectory.dir('src/generated/client')
def generatedServer = layout.projectDirectory.dir('src/generated/server')

tasks.register('syncGeneratedClient', Sync) {
    group = 'datagen'
    description = 'Synchronizes generated client resources.'

    from(datagenOutput) {
        include 'assets/**'
    }

    into generatedClient
}

tasks.register('syncGeneratedServer', Sync) {
    group = 'datagen'
    description = 'Synchronizes generated server resources.'

    from(datagenOutput) {
        include 'data/**'
    }

    into generatedServer
}

tasks.matching { it.name == 'runData' }.configureEach {
    finalizedBy 'syncGeneratedClient', 'syncGeneratedServer'
}

def replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version          : forge_version,
        forge_version_range    : forge_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description
]

tasks.named('processResources', ProcessResources).configure {
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }

    repositories {
        maven {
            url = layout.buildDirectory.dir('repo')
        }
    }
}

// ============================================================
// CurseForge Publishing
// ============================================================

tasks.register(
        'publishCurseForge',
        net.darkhax.curseforgegradle.TaskPublishCurseForge
) {
    group = 'publishing'
    description = "Publishes ${mod_name} for Forge to CurseForge"

    apiToken = providers.gradleProperty('curseforge_api_token').orNull

    def projectId = providers.gradleProperty('curseforge_project_id').orNull

    if (projectId) {
        def mainFile = upload(projectId, tasks.named('jar').get())

        mainFile.displayName =
                "${mod_name} ${mod_version} for Forge ${minecraft_version}"

        mainFile.releaseType = 'release'

        def changelogFile = file('src/main/resources/changelog.md')

        mainFile.changelogType = 'markdown'

        mainFile.changelog = changelogFile.exists()
                ? changelogFile.getText('UTF-8')
                : "${mod_name} ${mod_version} for Forge ${minecraft_version}"

        mainFile.addGameVersion(minecraft_version.toString())

        mainFile.addEnvironment('Client', 'Server')

        mainFile.addRequirement('geckolib')
        mainFile.addRequirement('thedragonlib')
    }
}
