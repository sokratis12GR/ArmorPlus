buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
}

plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'net.darkhax.curseforgegradle' version '1.1.26'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

tasks.named('jar', Jar).configure {
    archiveFileName = "${mod_id}-${minecraft_version}-${mod_version}-forge.jar"

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

println "Java: ${System.getProperty('java.version')}, JVM: ${System.getProperty('java.vm.version')} (${System.getProperty('java.vendor')}), Arch: ${System.getProperty('os.arch')}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    accessTransformer = file('src/main/resources/META-INF/armorplus_at.cfg')
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    maven {
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf('curse.maven:thedragonlib-248055:5498886')
    implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.21.1:4.8.2')

    implementation fg.deobf('curse.maven:jei-238222:6614391')
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact tasks.named('jar')
        }
    }
    repositories {
        maven {
            url = "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea.module {
    downloadJavadoc = downloadSources = true
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

tasks.register('publishCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    group = 'publishing'
    description = "Publishes ${mod_name} ${mod_version} for Forge to CurseForge"

    def token = providers.gradleProperty('curseforge_api_token')
            .orElse(providers.environmentVariable('CURSEFORGE_API_TOKEN'))
            .orNull

    // ArmorPlus CurseForge project ID, overridable in gradle.properties.
    def projectId = providers.gradleProperty('curseforge_project_id')
            .orElse('237366')
            .get()

    apiToken = token

    doFirst {
        if (!token) {
            throw new GradleException('Missing curseforge_api_token or CURSEFORGE_API_TOKEN.')
        }
    }

    def mainFile = upload(projectId, tasks.named('jar').get())
    mainFile.displayName = "${mod_name} ${mod_version} for Forge ${minecraft_version}"
    mainFile.releaseType = 'release'

    def changelogFile = file('src/main/resources/changelog.md')
    mainFile.changelogType = 'markdown'
    mainFile.changelog = changelogFile.exists()
            ? changelogFile.getText('UTF-8')
            : "${mod_name} ${mod_version} for Forge ${minecraft_version}"

    mainFile.addGameVersion(minecraft_version.toString())
    mainFile.addModLoader('Forge')
    mainFile.addEnvironment('Client', 'Server')
    mainFile.addRequirement('geckolib')
    mainFile.addRequirement('thedragonlib')

    mainFile.addOptional('patchouli')
}
