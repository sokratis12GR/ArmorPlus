name: Feature request
description: Suggest an idea for ArmorPlus
title: "[Feature] "
labels: ["to-review"]
assignees: ["sokratis12GR"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the [existing issues](https://github.com/sokratis12GR/ArmorPlus/issues?q=is%3Aissue) and this hasn't been suggested yet.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the mod is this about?
      options:
        - Armor
        - Weapons and tools
        - Runes and rituals
        - Mobs
        - World generation
        - Commands
        - Datapacks and API
        - Mod integration
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve? Ex. I'm always frustrated when [...]
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or features you've considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots or anything else about the feature request here.
